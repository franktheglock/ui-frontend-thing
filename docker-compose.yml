version: '3.8'

services:
  ai-chat-ui:
    build:
      context: .
      dockerfile: Dockerfile
    # Keep 127.0.0.1: prefix for host-only access. Publishing as "3456:3456" is
    # possible but non-local clients ALWAYS need a token (HOST-locked mode).
    ports:
      - "127.0.0.1:3456:3456"
    environment:
      - NODE_ENV=production
      - PORT=3456
      # Container must listen on all interfaces; host publish is loopback-only above.
      - HOST=0.0.0.0
      # Required: compose sets HOST=0.0.0.0, so non-loopback (docker-bridge) peers
      # need a token. Fails loudly at `docker compose up` if unset.
      - API_AUTH_TOKEN=${API_AUTH_TOKEN:?set API_AUTH_TOKEN in .env — required when HOST is set}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3456,http://127.0.0.1:3456}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - GOOGLE_PSE_API_KEY=${GOOGLE_PSE_API_KEY}
      - GOOGLE_PSE_CX=${GOOGLE_PSE_CX}
      - SEARXNG_URL=${SEARXNG_URL}
      - DATA_DIR=/app/data
      - SKILLS_DIR=/app/skills
      # Host-exec tools are opt-in (unsandboxed)
      - ENABLE_TERMINAL_TOOL=${ENABLE_TERMINAL_TOOL:-false}
      - ENABLE_PYTHON_TOOL=${ENABLE_PYTHON_TOOL:-false}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./skills:/app/skills
    restart: unless-stopped
