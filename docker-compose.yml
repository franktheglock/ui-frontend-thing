version: '3.8'

services:
  ai-chat-ui:
    build:
      context: .
      dockerfile: Dockerfile
    # Publish only on the host loopback interface (not 0.0.0.0 on the host)
    ports:
      - "127.0.0.1:3456:3456"
    environment:
      - NODE_ENV=production
      - PORT=3456
      # Container must listen on all interfaces; host publish is loopback-only above.
      - HOST=0.0.0.0
      - API_AUTH_TOKEN=${API_AUTH_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3456,http://127.0.0.1:3456}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - GOOGLE_PSE_API_KEY=${GOOGLE_PSE_API_KEY}
      - GOOGLE_PSE_CX=${GOOGLE_PSE_CX}
      - SEARXNG_URL=${SEARXNG_URL}
      - DATA_DIR=/app/data
      - SKILLS_DIR=/app/skills
      - ENABLE_TERMINAL_TOOL=${ENABLE_TERMINAL_TOOL:-true}
      - ENABLE_PYTHON_TOOL=${ENABLE_PYTHON_TOOL:-true}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./skills:/app/skills
    restart: unless-stopped
